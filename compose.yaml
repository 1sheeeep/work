name: recruitment-console

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - recruitment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
      APP_BOOTSTRAP_GROUP_NAME: ${APP_BOOTSTRAP_GROUP_NAME}
      APP_BOOTSTRAP_GROUP_SHORT_NAME: ${APP_BOOTSTRAP_GROUP_SHORT_NAME}
      APP_SECURE_COOKIE: "false"
      APP_REMEMBER_ME_DURATION: ${APP_REMEMBER_ME_DURATION:-7d}
      APP_LOGIN_MAX_FAILURES: ${APP_LOGIN_MAX_FAILURES:-5}
      APP_GATEWAY_TIMEOUT: ${APP_GATEWAY_TIMEOUT:-3s}
      APP_GATEWAY_MAX_CONCURRENT: ${APP_GATEWAY_MAX_CONCURRENT:-8}
      APP_GATEWAY_RATE_LIMIT_PER_MINUTE: ${APP_GATEWAY_RATE_LIMIT_PER_MINUTE:-120}
      APP_GATEWAY_CIRCUIT_FAILURE_THRESHOLD: ${APP_GATEWAY_CIRCUIT_FAILURE_THRESHOLD:-3}
      APP_GATEWAY_CIRCUIT_OPEN_DURATION: ${APP_GATEWAY_CIRCUIT_OPEN_DURATION:-30s}
      APP_BROWSER_MONITOR_ONLY: ${APP_BROWSER_MONITOR_ONLY:-true}
      APP_OPENAI_ENABLED: ${APP_OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-60s}
      APP_INBOUND_REPLY_MAX_PENDING_PER_ACCOUNT: ${APP_INBOUND_REPLY_MAX_PENDING_PER_ACCOUNT:-100}
      APP_INBOUND_REPLY_AUTO_SEND_ENABLED: ${APP_INBOUND_REPLY_AUTO_SEND_ENABLED:-false}
      APP_INBOUND_REPLY_SILENT_REVALIDATION_DELAY: ${APP_INBOUND_REPLY_SILENT_REVALIDATION_DELAY:-PT10S}
      APP_INBOUND_REPLY_MODEL_CONCURRENCY: ${APP_INBOUND_REPLY_MODEL_CONCURRENCY:-8}
      APP_INBOUND_REPLY_MAX_PENDING_GLOBAL: ${APP_INBOUND_REPLY_MAX_PENDING_GLOBAL:-1000}
      APP_INBOUND_REPLY_SEND_LIMIT_PER_HOUR: ${APP_INBOUND_REPLY_SEND_LIMIT_PER_HOUR:-20}
      APP_INBOUND_REPLY_SEND_LIMIT_PER_DAY: ${APP_INBOUND_REPLY_SEND_LIMIT_PER_DAY:-100}
      APP_RESUME_MALWARE_SCAN_ENABLED: ${APP_RESUME_MALWARE_SCAN_ENABLED:-false}
      APP_RESUME_MALWARE_SCAN_HOST: ${APP_RESUME_MALWARE_SCAN_HOST:-clamav}
      APP_RESUME_MALWARE_SCAN_PORT: ${APP_RESUME_MALWARE_SCAN_PORT:-3310}
      APP_RESUME_OCR_ENABLED: ${APP_RESUME_OCR_ENABLED:-false}
      APP_RESUME_OCR_HOST: ${APP_RESUME_OCR_HOST:-resume-ocr}
      APP_RESUME_OCR_PORT: ${APP_RESUME_OCR_PORT:-8090}
      APP_RESUME_ANALYSIS_RETENTION_ENABLED: ${APP_RESUME_ANALYSIS_RETENTION_ENABLED:-true}
      APP_RESUME_ANALYSIS_RETENTION_DAYS: ${APP_RESUME_ANALYSIS_RETENTION_DAYS:-90}
      APP_RESUME_SOURCE_PDF_CLEANUP_INTERVAL: ${APP_RESUME_SOURCE_PDF_CLEANUP_INTERVAL:-7d}
      APP_RESUME_SOURCE_PDF_CLEANUP_INITIAL_DELAY: ${APP_RESUME_SOURCE_PDF_CLEANUP_INITIAL_DELAY:-1h}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 75s
    read_only: true
    tmpfs:
      - /tmp

  clamav:
    image: clamav/clamav:1.4
    profiles: ["malware-scan"]
    expose:
      - "3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 3m
    restart: unless-stopped

  resume-ocr:
    build:
      context: ./resume-ocr
    profiles: ["ocr"]
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ./frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config
      - /data
    networks:
      default:
      public-ingress:
        aliases:
          - recruitment-console-web

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - recruitment_prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

volumes:
  recruitment_postgres_data:
  clamav_signatures:
  recruitment_prometheus_data:

networks:
  public-ingress:
    external: true
    name: xz-erp-public-ingress
