name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: maven:3.9-eclipse-temurin-21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run backend tests
        run: mvn -B -ntp -f backend/pom.xml test

  javascript:
    name: Frontend and browser components
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The dashboard date filters are defined in the business timezone.
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Check browser bridge
        run: npm run check && npm test
        working-directory: boss-browser-bridge
      - name: Install local connector dependencies
        run: npm ci
        working-directory: boss-local-connector
      - name: Check local connector
        run: npm run check && npm test
        working-directory: boss-local-connector
