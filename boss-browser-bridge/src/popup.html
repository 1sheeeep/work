<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>BOSS 招聘桥接</title>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <span class="mark" aria-hidden="true">值</span>
    <div class="brand-copy">
      <strong>BOSS 招聘桥接</strong>
      <small>保持连接，自动处理来信</small>
    </div>
    <div class="top-actions">
      <button id="enabledToggle" class="plugin-toggle" type="button" aria-pressed="false" hidden>插件已开启</button>
      <span id="stateBadge" class="badge">检查中</span>
    </div>
  </header>

  <section id="summary" hidden>
    <section class="context-bar" aria-label="当前连接">
      <div><small>账号</small><strong id="accountName">-</strong></div>
      <div><small>页面</small><strong id="pageContext">未识别</strong></div>
    </section>

    <div class="quick-actions">
      <button id="collect" class="secondary" type="button">刷新状态</button>
      <button id="openConsole" class="secondary" type="button">打开值守台</button>
    </div>

    <details class="more-info">
      <summary><span>更多信息</span><small>自动回复 · 统计 · 会话记录</small></summary>
      <div class="more-info-content">
        <div class="reply-section">
          <div class="reply-heading">
            <div><strong>自动回复</strong><small id="continuousReplyState">当前未开启</small></div>
            <span id="continuousReplyBadge" class="badge">已停止</span>
          </div>
          <small id="lastContinuousReply" class="muted">尚未处理消息</small>
        </div>
        <section class="stats" aria-label="当前数据">
          <article><strong id="currentUnreadCount">0</strong><span>当前未读</span></article>
          <article><strong id="trackedUnreadCount">0</strong><span>观察队列</span></article>
          <article><strong id="totalCount">0</strong><span>本次会话</span></article>
        </section>
        <section class="sync-strip">
          <div>
            <strong>当前会话记录</strong>
            <small id="detailState">尚未复核当前会话</small>
            <small id="lastSync">尚未同步真实快照</small>
          </div>
          <button id="copyCurrentTranscript" class="secondary compact" type="button">复制记录</button>
        </section>
      </div>
    </details>

    <details class="advanced-tools">
      <summary><span>高级工具</span><small>职位同步 · DOM 诊断</small></summary>
      <div class="advanced-content">
        <div class="tool-item">
          <strong>职位同步</strong>
          <span id="jobState">尚未同步职位页面。</span>
          <small id="lastJobSync"></small>
          <button id="collectJobs" class="secondary" type="button">同步当前职位页</button>
        </div>
        <div class="tool-item">
          <strong>DOM 诊断</strong>
          <span id="controlDiagnosticState">尚未生成报告。</span>
          <small id="lastControlDiagnostic"></small>
          <div class="button-grid">
            <button id="inspectControls" class="secondary" type="button">重新识别 DOM</button>
            <button id="copyControlDiagnostic" class="secondary" type="button" disabled>复制报告</button>
          </div>
          <textarea id="controlDiagnosticReport" readonly hidden aria-label="脱敏功能键 DOM 报告"></textarea>
        </div>
        <button id="forget" class="text-button" type="button">解除本机绑定</button>
      </div>
    </details>
  </section>

  <form id="pairForm" hidden>
    <div class="eyebrow">首次使用</div>
    <h1>连接招聘值守台</h1>
    <p>在招聘账号页面生成一次性接入码后完成配对。</p>
    <label>后台地址<input id="backendUrl" maxlength="120" value="http://localhost:8088" placeholder="http://localhost:8088" required></label>
    <label>设备名称<input id="deviceName" maxlength="80" value="HR 电脑" required></label>
    <label>一次性接入码<textarea id="pairingToken" maxlength="200" rows="3" required></textarea></label>
    <div class="button-grid"><button id="saveBackendUrl" class="secondary" type="button">保存地址</button><button class="primary" type="submit">完成配对</button></div>
  </form>

  <div id="message" class="message" hidden></div>
  <footer>版本 <span id="pluginVersion">-</span> · 默认只读，不读取 Cookie 或密码</footer>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
