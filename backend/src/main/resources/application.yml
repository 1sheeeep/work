spring:
  application:
    name: recruitment-console
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recruitment}
    username: ${SPRING_DATASOURCE_USERNAME:recruitment}
    password: ${SPRING_DATASOURCE_PASSWORD:recruitment}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      location: ${APP_RESUME_MULTIPART_TEMP_LOCATION:/tmp/resume-upload}
      max-file-size: 8MB
      max-request-size: 8MB

server:
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: RECRUITMENT_SESSION
        http-only: true
        same-site: lax
        secure: ${APP_SECURE_COOKIE:false}
      timeout: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

app:
  auto-reply:
    enabled: ${APP_AUTO_REPLY_ENABLED:false}
    instance-id: ${APP_AUTO_REPLY_INSTANCE_ID:${HOSTNAME:auto-reply-local}}
    poll-interval: ${APP_AUTO_REPLY_POLL_INTERVAL:15s}
    initial-delay: ${APP_AUTO_REPLY_INITIAL_DELAY:15s}
    lease-duration: ${APP_AUTO_REPLY_LEASE_DURATION:45s}
    batch-size: ${APP_AUTO_REPLY_BATCH_SIZE:20}
  browser:
    monitor-only: ${APP_BROWSER_MONITOR_ONLY:true}
    draft-fill-enabled: ${APP_BROWSER_DRAFT_FILL_ENABLED:false}
    safety-watchdog-interval: ${APP_BROWSER_SAFETY_WATCHDOG_INTERVAL:30s}
    heartbeat-timeout: ${APP_BROWSER_HEARTBEAT_TIMEOUT:2m}
  gateway:
    timeout: ${APP_GATEWAY_TIMEOUT:3s}
    max-concurrent: ${APP_GATEWAY_MAX_CONCURRENT:8}
    rate-limit-per-minute: ${APP_GATEWAY_RATE_LIMIT_PER_MINUTE:120}
    circuit-failure-threshold: ${APP_GATEWAY_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-open-duration: ${APP_GATEWAY_CIRCUIT_OPEN_DURATION:30s}
  security:
    login-max-failures: ${APP_LOGIN_MAX_FAILURES:5}
    login-window: ${APP_LOGIN_WINDOW:15m}
    login-block-duration: ${APP_LOGIN_BLOCK_DURATION:15m}
  bootstrap:
    admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    group-name: ${APP_BOOTSTRAP_GROUP_NAME:}
    group-short-name: ${APP_BOOTSTRAP_GROUP_SHORT_NAME:}
  openai:
    enabled: ${APP_OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout: ${OPENAI_TIMEOUT:60s}
  resume:
    malware-scan:
      enabled: ${APP_RESUME_MALWARE_SCAN_ENABLED:false}
      host: ${APP_RESUME_MALWARE_SCAN_HOST:clamav}
      port: ${APP_RESUME_MALWARE_SCAN_PORT:3310}
      connect-timeout: ${APP_RESUME_MALWARE_SCAN_CONNECT_TIMEOUT:3s}
      read-timeout: ${APP_RESUME_MALWARE_SCAN_READ_TIMEOUT:12s}
    ocr:
      enabled: ${APP_RESUME_OCR_ENABLED:false}
      host: ${APP_RESUME_OCR_HOST:resume-ocr}
      port: ${APP_RESUME_OCR_PORT:8090}
      connect-timeout: ${APP_RESUME_OCR_CONNECT_TIMEOUT:3s}
      timeout: ${APP_RESUME_OCR_TIMEOUT:30s}
    analysis-retention:
      enabled: ${APP_RESUME_ANALYSIS_RETENTION_ENABLED:true}
      days: ${APP_RESUME_ANALYSIS_RETENTION_DAYS:90}
      batch-size: ${APP_RESUME_ANALYSIS_RETENTION_BATCH_SIZE:50}
      cleanup-interval: ${APP_RESUME_ANALYSIS_RETENTION_CLEANUP_INTERVAL:1h}
      initial-delay: ${APP_RESUME_ANALYSIS_RETENTION_INITIAL_DELAY:5m}
