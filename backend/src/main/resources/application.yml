spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: recruitment-console
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recruitment}
    username: ${SPRING_DATASOURCE_USERNAME:recruitment}
    password: ${SPRING_DATASOURCE_PASSWORD:recruitment}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: RECRUITMENT_SESSION
        http-only: true
        same-site: lax
        secure: ${APP_SECURE_COOKIE:false}
      timeout: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

app:
  ai:
    mode: ${APP_AI_MODE:MOCK}
    base-url: ${APP_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${APP_AI_API_KEY:}
    model: ${APP_AI_MODEL:mock-recruitment-v1}
    prompt-version: ${APP_AI_PROMPT_VERSION:recruitment-assistant-v1}
    timeout: ${APP_AI_TIMEOUT:15s}
    allow-candidate-data: ${APP_AI_ALLOW_CANDIDATE_DATA:false}
  notification:
    mode: ${APP_NOTIFICATION_MODE:MOCK}
    webhook-url: ${APP_NOTIFICATION_WEBHOOK_URL:}
    webhook-secret: ${APP_NOTIFICATION_WEBHOOK_SECRET:}
    timeout: ${APP_NOTIFICATION_TIMEOUT:5s}
    allow-insecure-http: ${APP_NOTIFICATION_ALLOW_INSECURE_HTTP:false}
    trial-enabled: ${APP_NOTIFICATION_TRIAL_ENABLED:false}
    trial-recipient-ids: ${APP_NOTIFICATION_TRIAL_RECIPIENT_IDS:}
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:true}
    instance-id: ${APP_SCHEDULER_INSTANCE_ID:${HOSTNAME:scheduler-local}}
    poll-interval: ${APP_SCHEDULER_POLL_INTERVAL:10s}
    initial-delay: ${APP_SCHEDULER_INITIAL_DELAY:10s}
    lease-duration: ${APP_SCHEDULER_LEASE_DURATION:45s}
    cadence: ${APP_SCHEDULER_CADENCE:1m}
    batch-size: ${APP_SCHEDULER_BATCH_SIZE:20}
  gateway:
    timeout: ${APP_GATEWAY_TIMEOUT:3s}
    max-concurrent: ${APP_GATEWAY_MAX_CONCURRENT:8}
    rate-limit-per-minute: ${APP_GATEWAY_RATE_LIMIT_PER_MINUTE:120}
    circuit-failure-threshold: ${APP_GATEWAY_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-open-duration: ${APP_GATEWAY_CIRCUIT_OPEN_DURATION:30s}
  security:
    login-max-failures: ${APP_LOGIN_MAX_FAILURES:5}
    login-window: ${APP_LOGIN_WINDOW:15m}
    login-block-duration: ${APP_LOGIN_BLOCK_DURATION:15m}
  bootstrap:
    admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    group-name: ${APP_BOOTSTRAP_GROUP_NAME:}
    group-short-name: ${APP_BOOTSTRAP_GROUP_SHORT_NAME:}
