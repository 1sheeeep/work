<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>采集当前 BOSS 岗位</title><link rel="stylesheet" href="ui.css"><style>.capture-page{max-width:820px}.capture-page header p{color:#667085}.capture-kicker{color:#0f766e;font-size:12px;font-weight:800;letter-spacing:.12em}.capture-status{margin-bottom:18px;padding:13px 15px;border-radius:9px;background:#eef4ff;color:#2459a9}.capture-status.success{background:#ecfdf3;color:#087f5b}.capture-status.warning{background:#fff7ed;color:#b54708}.capture-status.error{background:#fef3f2;color:#b42318}.capture-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.capture-actions .secondary{background:#eef2f6;color:#344054}</style></head>
<body><main class="capture-page"><header><span class="capture-kicker">JOB CAPTURE</span><h1>采集当前 BOSS 岗位</h1><p>从已打开的岗位详情页读取可见信息。请核对后保存，系统只会创建职位草稿。</p></header><section><div id="status" class="capture-status">正在查找当前 BOSS 岗位页…</div><form id="form"><div class="grid"><label>职位名称<input name="title" maxlength="120" required></label><label>工作地点<input name="location" maxlength="120" required></label><label>月薪下限（K）<input name="salaryMinK" type="number" min="1" max="1000" required></label><label>月薪上限（K）<input name="salaryMaxK" type="number" min="1" max="1000" required></label><label>薪数<input name="salaryMonths" type="number" min="12" max="16" required></label><label>经验要求<input name="experienceRequirement" maxlength="80" required></label><label>学历要求<input name="educationRequirement" maxlength="80" required></label></div><label>职位描述<textarea name="description" rows="10" maxlength="10000" required></textarea></label><label>筛选要求（可选）<textarea name="screeningRequirements" rows="4" maxlength="5000"></textarea></label><div class="capture-actions"><button type="button" id="refresh" class="secondary">重新采集</button><button type="submit" id="save">确认并保存草稿</button></div></form></section></main><script type="module" src="job-capture.js"></script></body>
</html>
