<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="stylesheet" href="ui.css"><style>.popup{width:330px;padding:18px;background:#fff}.popup h2{margin:4px 0 14px;font-size:20px}.popup-kicker{color:#0f766e;font-size:11px;font-weight:800;letter-spacing:.1em}.popup-state{display:grid;gap:4px;padding:12px;border-radius:9px;background:#fff7ed;color:#9a3412}.popup-state.ok{background:#ecfdf3;color:#087f5b}.popup-state span{font-size:12px}.checklist{display:grid;gap:8px;margin:14px 0}.checklist p{display:flex;align-items:center;gap:9px;margin:0;color:#667085;font-size:13px}.checklist i{display:grid;width:22px;height:22px;place-items:center;border-radius:50%;background:#eef2f6;font-style:normal;font-size:11px}.checklist .done{color:#172826}.checklist .done i{background:#ccfbf1;color:#0f766e}.popup button{width:100%;margin-top:8px}.popup .secondary{background:#eef2f6;color:#344054}.popup .capture{background:#0f766e}.popup .quota,.popup-help{color:#667085;font-size:12px}.popup-help{margin-bottom:0;line-height:1.5}</style></head>
<body class="popup"><span class="popup-kicker">BOSS 账号连接</span><h2>托管准备检查</h2><div id="state">正在读取…</div><button id="capture" class="capture">采集当前岗位</button><button id="emergency" class="danger">紧急停止</button><button id="options" class="secondary">连接与诊断设置</button><p class="popup-help">岗位采集只读取当前页面可见信息，保存后仍是待核对草稿。</p><script type="module" src="popup.js"></script></body>
</html>
