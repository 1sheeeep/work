<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岗位采集实验台</title>
  <style>body{margin:0;background:#f4f6fa;color:#172b2a;font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.shell{max-width:900px;margin:48px auto;padding:0 20px}.dev{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff4e5;color:#b54708;font-size:12px;font-weight:700}.job-detail-header,.job-detail-section{margin-top:18px;padding:28px;border:1px solid #dbe6e3;border-radius:16px;background:#fff}.name{margin:0;font-size:30px}.salary{margin:12px 0;color:#087f5b;font-size:23px;font-weight:800}.job-primary{display:flex;gap:10px;flex-wrap:wrap}.job-primary span,.job-area{padding:6px 10px;border-radius:8px;background:#f0faf7;color:#40635e}.job-detail-section h2{margin-top:0}.job-sec-text{white-space:pre-line;color:#344054}</style>
</head>
<body>
  <main class="shell">
    <span class="dev">仅用于本地岗位采集验收，不连接 BOSS</span>
    <section class="job-detail-header">
      <h1 class="name">Node.js 全栈开发工程师</h1>
      <p class="salary">20-35K·13薪</p>
      <p class="job-area">上海·徐汇区</p>
      <div class="job-primary"><span>3-5年经验</span><span>本科</span><span>全职</span></div>
    </section>
    <section class="job-detail-section">
      <h2>职位描述</h2>
      <div class="job-sec-text">负责企业招聘产品的前后端功能开发与迭代。
与产品、设计协作，持续优化招聘工作台的稳定性和易用性。
熟悉 Node.js、TypeScript、Vue 或 React，具备良好的工程化意识。</div>
    </section>
  </main>
</body>
</html>
