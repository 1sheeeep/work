<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>BOSS 招聘会话实验台</title><style>
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;background:#eef2f7;margin:0;color:#172033}.toolbar{position:sticky;top:0;z-index:5;background:#101828;color:#fff;padding:12px 18px}.toolbar h1{font-size:17px;margin:0 0 10px}.controls{display:flex;flex-wrap:wrap;gap:7px}.controls button{border:1px solid #475467;background:#344054;color:#fff;border-radius:6px;padding:7px 10px;cursor:pointer}.controls button.danger{background:#b42318}.layout{display:grid;grid-template-columns:minmax(700px,1fr) 320px;gap:16px;max-width:1320px;margin:18px auto;padding:0 14px}.shell{display:grid;grid-template-columns:250px 1fr;height:700px;background:#fff;border:1px solid #d0d5dd;border-radius:10px;overflow:hidden}.list{border-right:1px solid #e4e7ec;padding:12px}.conversation{padding:12px;border-radius:7px;cursor:pointer}.conversation.active{background:#eef4ff}.conversation small{display:block;color:#667085;margin-top:5px}.chat{display:grid;grid-template-rows:auto 1fr auto}.head,.compose{padding:16px}.head{border-bottom:1px solid #e4e7ec}.messages{padding:20px;overflow:auto;background:#fafafa}.message{max-width:70%;padding:10px 14px;margin:10px;border-radius:10px;background:#edf2f9;white-space:pre-wrap}.message[data-direction=OUTBOUND]{margin-left:auto;background:#dcecff}.compose{border-top:1px solid #e4e7ec;display:flex;gap:10px}textarea{flex:1;height:70px;padding:8px}#send{padding:0 24px}.diagnostics{background:#fff;border:1px solid #d0d5dd;border-radius:10px;padding:15px;height:700px;overflow:auto}.diagnostics h2{font-size:16px}.status{display:grid;grid-template-columns:110px 1fr;gap:7px}.status dt{color:#667085}.status dd{margin:0;word-break:break-all}.risk-banner{padding:14px;background:#fff1f0;color:#b42318;border:1px solid #fda29b}.log{font:12px ui-monospace,monospace;background:#101828;color:#d0d5dd;padding:10px;min-height:180px;white-space:pre-wrap}.hint{color:#667085;line-height:1.6}@media(max-width:1050px){.layout{grid-template-columns:1fr}.diagnostics{height:auto}}
</style></head><body><header class="toolbar"><h1>BOSS 招聘会话实验台（不连接真实平台）</h1><div class="controls"><button data-action="inbound">候选人新消息</button><button data-action="hr-reply">模拟 HR 回复</button><button data-action="switch">切换会话</button><button data-action="send-failure">切换发送失败</button><button data-action="unknown-direction">注入未知方向</button><button data-action="invalid-time">注入无效时间</button><button data-action="dom-drift">切换 DOM 改版</button><button data-action="risk" class="danger">切换验证码</button><button data-action="login-expired" class="danger">切换登录失效</button><button data-action="reset">重置</button></div></header><div id="risk"></div><div class="layout"><section class="shell"><aside class="list"><h3>候选人消息</h3><div id="conversations"></div></aside><main id="chat"></main></section><aside class="diagnostics"><h2>场景诊断</h2><dl class="status" id="status"></dl><p class="hint">扩展设置选择器：当前会话 <code>.active-chat</code>；消息 <code>.message</code>；编辑器 <code>#editor</code>；发送按钮 <code>#send</code>。DOM 改版场景会故意破坏这些标识。</p><h2>事件</h2><div class="log" id="log"></div></aside></div><script type="module" src="simulator.js"></script></body></html>
