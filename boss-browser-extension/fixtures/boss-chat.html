<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>模拟 BOSS 招聘会话</title><style>body{font-family:sans-serif;background:#f4f6fa;margin:0}.shell{display:grid;grid-template-columns:260px 1fr;max-width:1000px;height:720px;margin:30px auto;background:white;border:1px solid #ddd}.list{border-right:1px solid #ddd;padding:16px}.chat{display:grid;grid-template-rows:auto 1fr auto}.head,.compose{padding:16px;border-bottom:1px solid #eee}.messages{padding:20px;overflow:auto}.message{max-width:65%;padding:10px 14px;margin:10px;border-radius:10px;background:#edf2f9}.message[data-direction=OUTBOUND]{margin-left:auto;background:#dcecff}.compose{border-top:1px solid #eee;border-bottom:0;display:flex;gap:10px}textarea{flex:1;height:70px}button{padding:0 24px}</style></head><body><div class="shell"><aside class="list"><h3>候选人消息</h3><p>张同学</p></aside><main class="chat active-chat" data-conversation-id="fixture-chat-1"><header class="head"><b class="candidate-name">张同学</b> · <span class="job-title">Java 开发工程师</span></header><section class="messages"><article class="message" data-message-id="fixture-inbound-1" data-direction="INBOUND">您好，请问职位还在招聘吗？</article></section><footer class="compose"><textarea id="editor"></textarea><button id="send">发送</button></footer></main></div><script>const message=document.querySelector('.message');message.dataset.createdAt=new Date(Date.now()-130*60*1000).toISOString();document.querySelector('#send').onclick=()=>{const editor=document.querySelector('#editor');if(!editor.value.trim())return;const item=document.createElement('article');item.className='message';item.dataset.direction='OUTBOUND';item.dataset.messageId='fixture-outbound-'+Date.now();item.dataset.createdAt=new Date().toISOString();item.textContent=editor.value;document.querySelector('.messages').append(item);editor.value=''}</script></body></html>
