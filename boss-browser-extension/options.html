<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>BOSS 会话伴随助手设置</title><link rel="stylesheet" href="ui.css"></head><body><main><h1>BOSS 会话伴随助手</h1><div class="warning">没有官方接口时仍存在账号风险。本扩展不读取 Cookie、不绕过验证码、不伪造指纹；风险提示出现时会停止。</div><form id="form">
<section><h2>账号与安全配对</h2><label>后端地址<input name="backendUrl"></label><label>一次性配对令牌<input id="pairingToken" autocomplete="off"></label><button type="button" id="pair">配对设备</button><span id="pairResult"></span><label>账号别名<input name="accountAlias" maxlength="80"></label><label class="check danger"><input type="checkbox" name="monitorOnly">只监测模式（测试阶段必须开启，硬性禁止发送）</label><label class="check danger"><input type="checkbox" name="emergencyStop">本机紧急停止（开启时不同步消息）</label><label class="check"><input type="checkbox" name="requireVisibleTab">仅会话页在前台时监测</label><label class="check"><input type="checkbox" name="syncMessageContent">向后端同步消息正文（默认关闭）</label></section>
<section><h2>发送保护</h2><p>是否启用、超时时长、日配额、最小间隔、发送时段和回复模板均以招聘系统后台策略为唯一权威来源，扩展不再保存可覆盖的本地副本。</p></section>
<section><h2>页面适配器</h2><p>真实招聘端页面到位后再填写。选择器不完整时系统只会停机，不会猜测点击。</p><button type="button" id="applyBossMonitorPreset">应用真实 BOSS 只监测预设</button><div id="selectors" class="grid"></div></section>
<button type="submit">保存设置</button><output id="result"></output></form><section><h2>只读运行诊断</h2><p>仅显示不可逆摘要和适配状态，不保存候选人姓名、消息正文、Cookie、密码或原始会话 ID。</p><div class="diagnostic-actions"><button type="button" id="collectStructure">被动采集页面结构</button><button type="button" id="detectCurrentPage">检测当前 BOSS 页面</button><button type="button" id="refreshDiagnostics">刷新</button><button type="button" id="exportDiagnostics">导出脱敏报告</button><button type="button" id="clearDiagnostics">清空</button></div><p id="pageDetectionResult"></p><p id="structureResult"></p><dl id="diagnosticCurrent" class="diagnostic-grid"></dl><h3>最近状态变化</h3><div class="diagnostic-events" id="diagnosticEvents">暂无诊断记录</div></section></main><script type="module" src="options.js"></script></body></html>
