<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>BOSS 会话伴随助手设置</title><link rel="stylesheet" href="ui.css"></head><body><main><h1>BOSS 会话伴随助手</h1><div class="warning">没有官方接口时仍存在账号风险。本扩展不读取 Cookie、不绕过验证码、不伪造指纹；风险提示出现时会停止。</div><form id="form">
<section><h2>账号与安全配对</h2><label>后端地址<input name="backendUrl"></label><label>一次性配对令牌<input id="pairingToken" autocomplete="off"></label><button type="button" id="pair">配对设备</button><span id="pairResult"></span><label>账号别名<input name="accountAlias" maxlength="80"></label><label class="check"><input type="checkbox" name="enabled">启用页面监测</label><label class="check danger"><input type="checkbox" name="automaticSend">允许超时后自动点击发送</label><label class="check"><input type="checkbox" name="requireVisibleTab">仅会话页在前台时发送</label><label class="check"><input type="checkbox" name="syncMessageContent">向后端同步消息正文（默认关闭）</label></section>
<section><h2>发送保护</h2><div class="grid"><label>超时分钟<input type="number" name="timeoutMinutes" min="5"></label><label>每日上限<input type="number" name="dailyLimit" min="1" max="200"></label><label>最小间隔（秒）<input type="number" name="minimumIntervalSeconds" min="30"></label><label>开始时间<input type="time" name="windowStart"></label><label>结束时间<input type="time" name="windowEnd"></label></div><label>回复模板<textarea name="template" rows="4"></textarea></label></section>
<section><h2>页面适配器</h2><p>真实招聘端页面到位后再填写。选择器不完整时系统只会停机，不会猜测点击。</p><div id="selectors" class="grid"></div></section>
<button type="submit">保存设置</button><output id="result"></output></form></main><script type="module" src="options.js"></script></body></html>
