  AI_SETTINGS_ENCRYPTION_KEY: ${AI_SETTINGS_ENCRYPTION_KEY:?AI_SETTINGS_ENCRYPTION_KEY is required}
  OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
  OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:-}
