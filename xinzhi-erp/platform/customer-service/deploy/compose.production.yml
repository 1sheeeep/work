  XZDESK_ACTIVE_COLOR_FILE: /var/run/xzdesk-deploy/active-color
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

x-api-service: &api-service
  dns:
    - 1.1.1.1
    - 8.8.8.8
  extra_hosts:
    - "97fhkz-dz.myshopify.com:23.227.38.74"
    - "1fyp5m-fz.myshopify.com:23.227.38.74"
  restart: unless-stopped
  logging: &default-logging
    driver: local
    options:
      max-size: "20m"
      max-file: "5"
  environment: *api-environment
  volumes:
    - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    - type: bind
      source: "${XZDESK_POSTGRES_TLS_DIR:?XZDESK_POSTGRES_TLS_DIR is required}/server.crt"
      target: /etc/xzdesk/postgres-tls/server.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: "${XZDESK_UPLOAD_HOST_DIR:?XZDESK_UPLOAD_HOST_DIR is required}"
      target: /var/lib/xzdesk/uploads
      bind:
        create_host_path: false
    - type: bind
      source: "${XZDESK_DEPLOY_STATE_HOST_DIR:-/opt/xzdesk/runtime/deploy}"
      target: /var/run/xzdesk-deploy
      read_only: true
      bind:
        create_host_path: false
  depends_on:
    postgres:
      condition: service_healthy
  expose:
    - "8787"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    interval: 5s
    timeout: 4s
    retries: 12
    start_period: 10s
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/xzdesk/postgres-tls/server.crt
      - -c
      - ssl_key_file=/etc/xzdesk/postgres-tls/server.key
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: shopify_support
    volumes:
      - type: bind
        source: "${XZDESK_POSTGRES_HOST_DIR:?XZDESK_POSTGRES_HOST_DIR is required}"
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: "${XZDESK_POSTGRES_TLS_DIR:?XZDESK_POSTGRES_TLS_DIR is required}/server.crt"
        target: /etc/xzdesk/postgres-tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${XZDESK_POSTGRES_TLS_DIR:?XZDESK_POSTGRES_TLS_DIR is required}/server.key"
        target: /etc/xzdesk/postgres-tls/server.key
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d shopify_support"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *api-service
    profiles: ["legacy"]
    image: ${XZDESK_API_LEGACY_IMAGE:-shopify-support-platform-api:latest}
    environment:
      <<: *api-environment
      XZDESK_RELEASE_ID: ${XZDESK_API_LEGACY_RELEASE:-legacy}
      XZDESK_DEPLOY_COLOR: legacy

  api-blue:
    <<: *api-service
    profiles: ["blue"]
    image: ${XZDESK_API_BLUE_IMAGE:-shopify-support-platform-api:blue}
    environment:
      <<: *api-environment
      XZDESK_RELEASE_ID: ${XZDESK_API_BLUE_RELEASE:-blue}
      XZDESK_DEPLOY_COLOR: blue

  api-green:
    <<: *api-service
    profiles: ["green"]
    image: ${XZDESK_API_GREEN_IMAGE:-shopify-support-platform-api:green}
    environment:
      <<: *api-environment
      XZDESK_RELEASE_ID: ${XZDESK_API_GREEN_RELEASE:-green}
      XZDESK_DEPLOY_COLOR: green

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      XZDESK_DOMAIN: ${XZDESK_DOMAIN:?XZDESK_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - erp-public-ingress

volumes:
  caddy-data:
  caddy-config:

networks:
  erp-public-ingress:
    external: true
    name: xz-erp-public-ingress
