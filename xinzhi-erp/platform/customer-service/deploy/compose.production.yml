  SHOPIFY_APP_API_SECRET: ${SHOPIFY_APP_API_SECRET:-}
  SHOPIFY_APP_BASE_URL: ${SHOPIFY_APP_BASE_URL:-}
  SHOPIFY_APP_CALLBACK_PATH: ${SHOPIFY_APP_CALLBACK_PATH:-/auth/callback}
  SHOPIFY_APP_API_VERSION: ${SHOPIFY_APP_API_VERSION:-2026-07}
