log_format api_access escape=json '{"time":"$time_iso8601","peer":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';

client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log api_access;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405 "method not allowed\n";
        }
        if ($args != "") {
            return 404 "not found\n";
        }

        auth_request /_backend_readiness;
        auth_request_set $backend_readiness_status $upstream_status;
        error_page 401 403 500 502 503 504 =503 @readiness_unavailable;

        root /usr/share/nginx/readiness;
        try_files /$backend_readiness_status =503;
    }

    location ~* ^/readyz(?:/|$) {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        return 404 "not found\n";
    }

    location ~* ^/actuator(?:/|$) {
        types { }
        default_type text/plain;
        return 404 "not found\n";
    }

    location = /_backend_readiness {
        internal;
        proxy_pass http://backend:8080/actuator/health/readiness?;
        proxy_method GET;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Host backend;
        proxy_set_header Connection close;
        proxy_connect_timeout 1s;
        proxy_send_timeout 1s;
        proxy_read_timeout 2s;
        proxy_next_upstream off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Server;
        proxy_hide_header Set-Cookie;
        proxy_hide_header WWW-Authenticate;
        proxy_hide_header Location;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Application-Context;
    }

    location @readiness_unavailable {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        return 503 "unavailable\n";
    }

    location ^~ /api/ {
        location ~* ^/api/actuator(?:/|$) {
            types { }
            default_type text/plain;
            return 404 "not found\n";
        }

        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/erp-operator/shopify-app-release/publish {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 11m;
        proxy_read_timeout 11m;
    }

    location ~ ^/(?:shopify/(?:oauth/(?:authorize|callback)|app|session/(?:exchange|products|orders|link-grant|chat-setup)|proxy/chat/session|privacy|terms|data-processing-terms|support|data-deletion|guide)|webhooks/shopify/(?:app/uninstalled|compliance))$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $shopify_connector http://shopify-connector:8790;
        proxy_pass $shopify_connector;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ (^|/)\. {
        types { }
        default_type text/plain;
        return 404 "not found\n";
    }

    location ~* ^/assets/.+\.(?:avif|css|gif|ico|jpe?g|js|json|mjs|png|svg|ttf|webmanifest|webp|woff2?)$ {
        root /usr/share/nginx/html;
        try_files $uri @static_not_found;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        types { }
        default_type text/plain;
        return 404 "not found\n";
    }

    location = /assets {
        types { }
        default_type text/plain;
        return 404 "not found\n";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        try_files /index.html @static_not_found;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /favicon.ico @static_not_found;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        try_files /manifest.webmanifest @static_not_found;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/.+\.[^/]+$ {
        types { }
        default_type text/plain;
        return 404 "not found\n";
    }

    location ~* (?:^|/)(?:dockerfile|license|nginx\.conf|package-lock\.json|package\.json|settings\.(?:js|json))$ {
        types { }
        default_type text/plain;
        return 404 "not found\n";
    }

    location @static_not_found {
        types { }
        default_type text/plain;
        return 404 "not found\n";
    }

    location / {
        root /usr/share/nginx/html;
        try_files /index.html @static_not_found;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
